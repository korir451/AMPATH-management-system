<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Records - AMPATH</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>AMPATH</h2>
      <ul>
        <li>
          <a href="patient_dashboard.html">
            <i class="fa fa-house"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="patient_appointments.html">
            <i class="fa fa-calendar"></i>
            <span>Appointments</span>
          </a>
        </li>
        <li>
          <a href="patient_medical_records.html" class="active">
            <i class="fa fa-file-medical"></i>
            <span>Records</span>
          </a>
        </li>
        <li>
          <a href="patient_lab_results.html">
            <i class="fa fa-vials"></i>
            <span>Lab Results</span>
          </a>
        </li>
        <li>
          <a href="patient_billing.html">
            <i class="fa fa-credit-card"></i>
            <span>Billing</span>
          </a>
        </li>
        <li>
          <a href="patient_login.html">
            <i class="fa fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div>
          <h2>My Medical Records</h2>
          <p style="color: gray; font-size: 14px;">Download summaries & view history</p>
        </div>
        <div class="profile">
          <img src="https://i.pravatar.cc/100" alt="patient" />
          <h4>Patient</h4>
        </div>
      </div>

      <div class="table-container">
        <h2>Record History</h2>
        <br />
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Record Type</th>
              <th>Doctor</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026-05-20</td>
              <td>Consultation Note</td>
              <td>Dr. Smith</td>
              <td><span class="status active">Available</span></td>
            </tr>
            <tr>
              <td>2026-04-18</td>
              <td>Discharge Summary</td>
              <td>Dr. Jane</td>
              <td><span class="status pending">Available</span></td>
            </tr>
          </tbody>
        </table>

        <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
          <button class="btn" type="button"><i class="fa fa-download"></i> Download All</button>
          <button class="btn" type="button" style="background: rgba(255,255,255,0.85); color:#0f172a; border:1px solid rgba(2,6,23,0.08); box-shadow:none;">Request New Record</button>
        </div>
      </div>
    </div>
  </body>
</html>
