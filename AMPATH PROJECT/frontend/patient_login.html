<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - AMPATH</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN PAGE WRAPPER -->
<div class="login-container">

    <div class="login-box fade-in">

        <!-- HEADER -->
        <h1>
            <i class="fa fa-hospital"></i>
            Patient Login
        </h1>

        <p style="text-align:center;color:gray;margin-bottom:25px;">
            Welcome back to AMPATH Health System
        </p>

        <!-- LOGIN FORM -->
        <form>

            <!-- EMAIL / PHONE -->
            <div class="form-group">
                <label>Email or Phone</label>
                <input type="text" placeholder="Enter email or phone number" required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
            </div>

            <!-- REMEMBER ME -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <label style="font-size:14px;">
                    <input type="checkbox"> Remember me
                </label>

                <a href="#" style="font-size:14px;color:#00b4d8;text-decoration:none;">
                    Forgot Password?
                </a>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn" style="width:100%;">
                <i class="fa fa-sign-in-alt"></i> Login
            </button>

        </form>

        <!-- REGISTER LINK -->
        <p style="text-align:center;margin-top:20px;">
            Don’t have an account?
            <a href="patient-registration.html" style="color:#00b4d8;text-decoration:none;">
                Register here
            </a>
        </p>

    </div>

</div>

</body>
</html>
