<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - AMPATH</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="hero" style="min-height: 72vh">
      <div class="login-container">
        <div class="login-box fade-in">
          <h1>
            <i class="fa fa-key" style="margin-right: 10px"></i> Reset Password
          </h1>
          <p
            style="
              text-align: center;
              color: gray;
              margin-bottom: 25px;
              margin-top: 10px;
            "
          >
            Password reset request placeholder.
          </p>

          <div class="alert alert-warning">
            JWT + email reset link + audit logging placeholders.
          </div>

          <div class="form-group">
            <label>Email or Phone</label>
            <input type="text" placeholder="Enter email or phone" required />
          </div>

          <button
            class="btn"
            style="width: 100%; margin-top: 14px"
            onclick="alert('Reset request placeholder')"
          >
            <i class="fa fa-envelope"></i> Send Reset Link
          </button>

          <div style="margin-top: 14px; text-align: center">
            <a href="login.html" style="color: #00b4d8; text-decoration: none"
              >Back to Login</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
