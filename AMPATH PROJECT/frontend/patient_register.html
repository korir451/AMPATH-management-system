<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR (same as dashboard) -->
<div class="sidebar">
    <h2>AMPATH</h2>

    <ul>
        <li><a href="index.html"><i class="fa fa-home"></i><span>Dashboard</span></a></li>
        <li><a href="#" class="active"><i class="fa fa-user"></i><span>Register Patient</span></a></li>
        <li><a href="#"><i class="fa fa-calendar"></i><span>Appointments</span></a></li>
        <li><a href="#"><i class="fa fa-triangle-exclamation"></i><span>Incidents</span></a></li>
    </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- TOP BAR -->
    <div class="topbar">
        <h2>Patient Registration</h2>
    </div>

    <!-- FORM -->
    <div class="form-container">

        <h2>Register New Patient</h2>
        <p style="margin-bottom:20px;color:gray;">Fill in patient details carefully</p>

        <form>

            <!-- FULL NAME -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter full name" required>
            </div>

            <!-- ID NUMBER -->
            <div class="form-group">
                <label>National ID</label>
                <input type="text" placeholder="ID Number" required>
            </div>

            <!-- AGE -->
            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Age" required>
            </div>

            <!-- GENDER -->
            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="07XXXXXXXX" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" placeholder="example@email.com">
            </div>

            <!-- ADDRESS -->
            <div class="form-group">
                <label>Address</label>
                <input type="text" placeholder="Location / Address">
            </div>

            <!-- DEPARTMENT -->
            <div class="form-group">
                <label>Department</label>
                <select required>
                    <option value="">Select Department</option>
                    <option>General</option>
                    <option>Cardiology</option>
                    <option>Oncology</option>
                    <option>Pediatrics</option>
                    <option>Mental Health</option>
                </select>
            </div>

            <!-- EMERGENCY CONTACT -->
            <div class="form-group">
                <label>Emergency Contact</label>
                <input type="text" placeholder="Next of kin phone number" required>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn">
                <i class="fa fa-save"></i> Register Patient
            </button>

        </form>

    </div>

</div>

</body>
</html>
